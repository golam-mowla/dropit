[package]
name = "dropit"
version = "0.1.0"
edition = "2024"
authors = ["DropIt Contributors"]
description = "Fast, lightweight, secure local WiFi file transfer tool"
license = "MIT"
readme = "README.md"
repository = "https://github.com/dropit-app/dropit"

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["multipart"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }
base64 = "0.23.1"
blake3 = "1.8"
clap = { version = "4.6", features = ["derive"] }
directories = "6.0"
hex = "0.4"
local-ip-address = "0.6"
mdns-sd = "0.21"
qrcode = "0.14"
rand = "0.10"
rcgen = "0.14"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "json"] }
rustls = { version = "0.23", features = ["ring"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
thiserror = "2.0"
tokio = { version = "1.54", features = ["full"] }
tokio-rustls = "0.26"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
