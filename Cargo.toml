[package]
name = "dropit"
version = "0.1.0"
edition = "2024"
authors = ["Golam Mowla"]
description = "Fast, lightweight, secure local WiFi file transfer tool and anonymous messenger"
readme = "README.md"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
anyhow = "1.0"
thiserror = "2.0"
tokio = { version = "1.43", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tokio-stream = "0.1"
futures-util = "0.3"

# Web server & TLS
axum = { version = "0.8", features = ["multipart"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rcgen = "0.13"

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-manual-roots", "stream", "json", "multipart"] }

# CLI & Config
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
directories = "6.0"

# Networking & Discovery
socket2 = "0.5"
local-ip-address = "0.6"

# Crypto & Hashing
blake3 = "1.5"
sha2 = "0.10"
rand = "0.8"
hex = "0.4"
base64 = "0.22"
spake2 = "0.4"
hkdf = "0.12"
chacha20poly1305 = "0.10"
zeroize = { version = "1.8", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }


# GUI & Glassmorphism
eframe = { version = "0.30", default-features = false, features = ["default_fonts", "glow", "icon_data"] }
[dev-dependencies]
tempfile = "3"

[build-dependencies]
winres = "0.1"