<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drop It</title>
  <style>
    :root {
      --bg: #09090b;
      --card: #18181b;
      --accent: #6366f1;
      --text: #f4f4f5;
      --muted: #71717a;
    }
    body {
      margin: 0;
      padding: 24px 16px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      width: 100%;
      max-width: 720px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 8px;
    }
    h1 {
      margin: 0;
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .badge {
      font-size: 0.85rem;
      color: var(--accent);
      background: rgba(99, 102, 241, 0.12);
      padding: 4px 10px;
      border-radius: 9999px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Drop It</h1>
      <span class="badge" id="device-name">Ready</span>
    </header>
  </div>
</body>
</html>
